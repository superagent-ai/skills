{
  "version": 1,
  "format_note": "JSON-compatible YAML. This file defines the normalized finding contract for hacker helpers and model-only skill output.",
  "severity_order": ["P0", "P1", "P2", "P3", "Informational"],
  "required_fields": [
    "source_skill",
    "severity",
    "category",
    "rule_id",
    "file",
    "title",
    "description",
    "recommendation"
  ],
  "fields": {
    "id": "Stable suite finding id. Helpers may derive it from source_skill, rule_id, file, line, and title.",
    "source_skill": "One skill name or a list of skill names that produced or contributed to the finding.",
    "severity": "P0, P1, P2, P3, Informational, or By-Design for vulnerability-triage only.",
    "category": "Short family such as Authorization, Secrets, Crypto, CI/CD, Infrastructure, Supply Chain, Skill Safety, Recon, or Triage.",
    "rule_id": "Stable child-skill rule id when available. Use a concise slug for model-only findings.",
    "file": "Repo-relative path, URL, or external target identifier.",
    "line": "One-based line number, or null when not file-based.",
    "line_range": "Two-item array [start, end] when the finding spans a range.",
    "title": "One-line finding title.",
    "description": "What is wrong and why it matters.",
    "evidence": "Redacted snippet or concise evidence. Never include full secrets or PII.",
    "recommendation": "Concrete remediation or next action.",
    "effort": "Quick Fix, Moderate, Complex, or Unknown.",
    "compliance_controls": "Optional map or list of SOC-2, PCI-DSS, ISO-27001, HIPAA, CWE, OWASP, or NIST references.",
    "confidence": "0.0 to 1.0 confidence when produced by a scanner or model judgment.",
    "source_status": "confirmed, candidate, false_positive, skipped, failed, by_design, or informational.",
    "dedupe_keys": {
      "primary": ["file", "line", "rule_id"],
      "secondary": ["file", "line_range", "category"]
    }
  },
  "adapter_notes": {
    "crypto-secrets": {
      "rule_id": "rule_id",
      "file": "file",
      "line": "line",
      "title": "title or rule_id",
      "evidence": "evidence"
    },
    "infra-security": {
      "rule_id": "control_id",
      "file": "file",
      "line": "line",
      "title": "title",
      "evidence": "snippet"
    },
    "skill-security": {
      "rule_id": "rule_id",
      "file": "file",
      "line": "line",
      "title": "title or rule_id",
      "evidence": "evidence"
    },
    "model_only_skills": {
      "note": "authz-security, ci-cd-security, supply-chain-security, recon-security, and vulnerability-triage should emit this normalized shape directly when used inside hacker."
    },
    "offensive-security": {
      "note": "Confirmed vulnerability outcomes use outcome, evidence, negative_control, blast_radius, remediation_priority from validator JSON; link via parent_finding_id to hacker finding id."
    }
  },
  "dedupe_rules": {
    "primary": "Merge findings with the same file, line, and rule_id. Keep the highest severity and union source_skill.",
    "secondary": "Merge findings in the same file and category when line ranges overlap or are very close and the descriptions describe the same issue.",
    "traceability": "Never discard the original source skill names or merge reason. Add each decision to merge_log."
  }
}
