{
  "version": 1,
  "format_note": "JSON-compatible YAML so helper scripts can parse this with Python stdlib json.",
  "default_skills": ["crypto-secrets", "supply-chain-security"],
  "optional_skill_conditions": {
    "recon-security": "Requires explicit live domain/IP scope plus authorization and rules of engagement.",
    "vulnerability-triage": "Requires a supplied advisory, CVE/GHSA, bug bounty report, or researcher submission.",
    "offensive-security": "Phase 6 — runs after all defensive skills, dedupe, and hacker report. Instruction-only multi-round subagent autoresearch; requires deduplicated findings JSON and explicit user request. Written scope enables validation; otherwise run local-only planning and mark live checks unsafe_to_test.",
    "infra-security": "Runs when infrastructure files are present.",
    "skill-security": "Runs when agent skills, MCP servers, plugins, or agent extension code are present."
  },
  "surfaces": {
    "app_code": ["src/", "app/", "lib/", "api/", "server/", "services/", "controllers/", "routes/", "resolvers/"],
    "ci_cd": [".github/workflows/", ".gitlab-ci.yml", "azure-pipelines.yml", "Jenkinsfile", "circle.yml"],
    "dependencies": ["package.json", "pnpm-lock.yaml", "yarn.lock", "package-lock.json", "requirements.txt", "pyproject.toml", "poetry.lock", "uv.lock", "go.mod", "Cargo.toml", "Gemfile", "pom.xml", "build.gradle", "composer.json", "*.csproj"],
    "infrastructure": ["*.tf", "*.tfvars", "*.hcl", "Dockerfile", "Dockerfile.*", "docker-compose.yml", "docker-compose.yaml", "k8s/", "kubernetes/", "helm/", "charts/", "cloudformation/", "template.yaml", "template.yml"],
    "agent_extensions": ["SKILL.md", "skills/", ".cursor/skills/", ".claude/skills/", ".cursor/agents/", ".claude/agents/", "mcp.json", ".mcp.json", "mcps/", "plugins/"],
    "mobile": ["android/", "ios/", "pubspec.yaml", "react-native.config.js", "AppDelegate.swift", "MainActivity.kt"],
    "frontend": ["public/", "static/", "vite.config.ts", "vite.config.js", "next.config.js", "nuxt.config.js", "angular.json"],
    "advisory": ["SECURITY.md", "advisories/", "CVE-", "GHSA-"]
  },
  "repo_types": {
    "web_api": {
      "description": "REST, GraphQL, RPC, or server-rendered API application.",
      "signals": ["routes/", "controllers/", "resolvers/", "api/", "server.ts", "server.js", "app.py", "main.py", "manage.py", "src/main/java/"],
      "skills": ["authz-security", "crypto-secrets", "supply-chain-security"],
      "optional_skills": ["ci-cd-security", "infra-security", "skill-security", "recon-security", "vulnerability-triage", "offensive-security"],
      "excluded_skills": []
    },
    "spa_frontend": {
      "description": "Single-page or static frontend with no obvious backend code.",
      "signals": ["vite.config.ts", "vite.config.js", "next.config.js", "nuxt.config.js", "angular.json", "public/", "static/", "src/App.tsx", "src/App.jsx"],
      "skills": ["crypto-secrets", "supply-chain-security"],
      "optional_skills": ["ci-cd-security", "infra-security", "recon-security", "vulnerability-triage", "offensive-security"],
      "excluded_skills": ["authz-security"]
    },
    "full_stack": {
      "description": "Monorepo containing frontend and backend application surfaces.",
      "signals": ["apps/", "packages/", "frontend/", "backend/", "client/", "server/", "api/", "web/"],
      "skills": ["authz-security", "crypto-secrets", "supply-chain-security"],
      "optional_skills": ["ci-cd-security", "infra-security", "skill-security", "recon-security", "vulnerability-triage", "offensive-security"],
      "excluded_skills": []
    },
    "library_package": {
      "description": "Reusable package or library distributed through a package registry.",
      "signals": ["package.json", "pyproject.toml", "setup.py", "setup.cfg", "go.mod", "Cargo.toml", "Gemfile", "pom.xml", "build.gradle", "*.csproj"],
      "skills": ["supply-chain-security", "crypto-secrets"],
      "optional_skills": ["ci-cd-security", "skill-security", "vulnerability-triage"],
      "excluded_skills": ["recon-security"]
    },
    "cli_tool": {
      "description": "Command-line tool that may handle local files, credentials, shells, or network calls.",
      "signals": ["bin/", "cmd/", "cli/", "src/cli/"],
      "skills": ["crypto-secrets", "supply-chain-security"],
      "optional_skills": ["ci-cd-security", "skill-security", "vulnerability-triage"],
      "excluded_skills": ["recon-security"]
    },
    "mobile_app": {
      "description": "Mobile app or cross-platform mobile project.",
      "signals": ["android/", "ios/", "pubspec.yaml", "react-native.config.js", "MainActivity.kt", "AppDelegate.swift"],
      "skills": ["crypto-secrets", "supply-chain-security"],
      "optional_skills": ["ci-cd-security", "infra-security", "recon-security", "vulnerability-triage"],
      "excluded_skills": []
    },
    "infrastructure_only": {
      "description": "Infrastructure-as-code repository with little or no application source.",
      "signals": ["*.tf", "*.tfvars", "*.hcl", "cloudformation/", "template.yaml", "template.yml", "k8s/", "kubernetes/", "helm/", "charts/", "Dockerfile", "docker-compose.yml"],
      "skills": ["infra-security", "crypto-secrets"],
      "optional_skills": ["ci-cd-security", "supply-chain-security", "recon-security", "vulnerability-triage", "offensive-security"],
      "excluded_skills": ["authz-security"]
    },
    "agent_plugin": {
      "description": "Agent skill, MCP server, plugin, subagent, or tool-extension repository.",
      "signals": ["SKILL.md", "skills/", ".cursor/skills/", ".claude/skills/", ".cursor/agents/", ".claude/agents/", "mcp.json", ".mcp.json", "mcps/", "plugins/"],
      "skills": ["skill-security", "crypto-secrets", "supply-chain-security"],
      "optional_skills": ["ci-cd-security", "infra-security", "vulnerability-triage"],
      "excluded_skills": ["recon-security"]
    }
  },
  "skill_triggers": {
    "ci-cd-security": [".github/workflows/", ".gitlab-ci.yml", "azure-pipelines.yml", "Jenkinsfile", "circle.yml"],
    "infra-security": ["*.tf", "*.tfvars", "*.hcl", "Dockerfile", "Dockerfile.*", "docker-compose.yml", "docker-compose.yaml", "k8s/", "kubernetes/", "helm/", "charts/", "cloudformation/", "template.yaml", "template.yml"],
    "skill-security": ["SKILL.md", "skills/", ".cursor/skills/", ".claude/skills/", ".cursor/agents/", ".claude/agents/", "mcp.json", ".mcp.json", "mcps/", "plugins/"],
    "recon-security": ["__domain_required__"],
    "vulnerability-triage": ["__advisory_required__"]
  }
}
