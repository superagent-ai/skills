templates:
  - id: network-exposure-db
    category: infra
    trigger_control_ids:
      - network-db-world-open
      - network-ssh-world-open
      - network-rdp-world-open
    type: network_exposure
    title_template: "Can an unauthenticated external host reach {{resource_type}} on port {{port}}?"
    validation_method: network_probe
    prerequisites:
      - Sandbox {{resource_type}} exists in isolated VPC
      - Security group rule is applied to sandbox instance
    safe_scope:
      max_requests: 5
      rate_limit_rps: 1
      allowed_targets: ["sandbox-instance-private-ip"]
      forbidden_actions: ["modify", "delete", "bruteforce"]
    success_criteria: "TCP connection established or service banner returned"
    example_poc: "nc -zv {{target_ip}} {{port}}"

  - id: authz-idor
    category: authz
    trigger_control_ids:
      - authz-missing-owner-scope
      - authz-bola
      - authz-idor
    type: privilege_escalation
    title_template: "Can user A access user B's {{resource_name}} by changing the ID parameter?"
    validation_method: parameter_tampering
    prerequisites:
      - Test API running with seed data for users A and B
      - Valid low-privilege token for user A
    safe_scope:
      max_requests: 10
      rate_limit_rps: 2
      allowed_targets: ["self-hosted-test-api"]
      forbidden_actions: ["modify_production_data", "delete"]
    success_criteria: "HTTP 200 with user B's data returned using user A's token"
    example_poc:
      step_1: "Login as user A → obtain token"
      step_2: "GET /api/resources/{{user_b_id}} with user A's Authorization header"
      step_3: "Assert response contains user B's data"

  - id: crypto-jwt-forgery
    category: crypto
    trigger_control_ids:
      - crypto-jwt-hardcoded-secret
      - secret-jwt-hmac-secret
      - crypto-jwt-alg-none
    type: credential_forgery
    title_template: "Can an attacker forge a valid JWT using the weak/hardcoded secret?"
    validation_method: token_forgery
    prerequisites:
      - JWT secret extracted from defensive report (redacted)
      - Test auth middleware running in sandbox
    safe_scope:
      max_requests: 3
      rate_limit_rps: 1
      allowed_targets: ["sandbox-auth-endpoint"]
      forbidden_actions: ["bruteforce", "modify_production_data"]
    success_criteria: "Self-issued JWT accepted by auth middleware for a protected route"
    example_poc:
      step_1: "Use pyjwt to encode payload {user_id: 999, role: admin} with extracted secret"
      step_2: "POST /api/admin with forged Authorization: Bearer <token>"
      step_3: "Assert HTTP 200 and admin data returned"

  - id: storage-s3-public-read
    category: infra
    trigger_control_ids:
      - storage-s3-public-acl
      - iam-wildcard-principal
    type: data_exfiltration
    title_template: "Can an unauthenticated caller list or read objects from the public S3 bucket?"
    validation_method: network_probe
    prerequisites:
      - Sandbox bucket with same ACL/policy pattern
    safe_scope:
      max_requests: 5
      rate_limit_rps: 1
      allowed_targets: ["sandbox-s3-endpoint"]
      forbidden_actions: ["modify", "delete", "bruteforce"]
    success_criteria: "Unauthenticated ListObjects or GetObject succeeds on sandbox bucket"
    example_poc: "aws s3 ls s3://sandbox-bucket --no-sign-request"

  - id: injection-missing-csp
    category: infra
    trigger_control_ids:
      - secrets-missing-tls
    type: injection
    title_template: "Can a reflected XSS payload execute in the sandbox web app without CSP?"
    validation_method: sandbox_execution
    prerequisites:
      - Sandbox web app mirrors missing CSP/header posture
    safe_scope:
      max_requests: 5
      rate_limit_rps: 1
      allowed_targets: ["sandbox-web-app"]
      forbidden_actions: ["modify_production_data"]
    success_criteria: "Benign alert payload reflected or executed in sandbox DOM"
    example_poc: "GET /search?q=<script>alert(1)</script> on sandbox only"

  - id: crypto-pickle-deser
    category: crypto
    trigger_control_ids:
      - crypto-pickle-unsafe
      - crypto-unsafe-deserialization
    type: injection
    title_template: "Does untrusted input reach pickle.loads in a way that executes code in sandbox?"
    validation_method: sandbox_execution
    prerequisites:
      - Isolated container with vulnerable code path
    safe_scope:
      max_requests: 3
      rate_limit_rps: 1
      allowed_targets: ["sandbox-container"]
      forbidden_actions: ["modify_production_data", "delete"]
    success_criteria: "Sandbox process writes proof file or spawns marker after crafted payload"
    example_poc: "Send base64 pickle gadget to sandbox /deserialize test route"

  - id: crypto-weak-password-hash
    category: crypto
    trigger_control_ids:
      - crypto-md5-password
      - crypto-sha1-password
      - crypto-weak-kdf
    type: credential_forgery
    title_template: "Can a known weak hash from the finding be reversed offline for a test password?"
    validation_method: sandbox_execution
    prerequisites:
      - Sample hash from finding is a known test vector only
    safe_scope:
      max_requests: 1
      rate_limit_rps: 1
      allowed_targets: ["offline-hash-lab"]
      forbidden_actions: ["bruteforce", "modify_production_data"]
    success_criteria: "Known test password matches hash without live service calls"
    example_poc: "Compare hash to precomputed test vector in sandbox script"

  - id: crypto-tls-verify-disabled
    category: crypto
    trigger_control_ids:
      - crypto-tls-verify-disabled
      - crypto-insecure-transport
    type: network_exposure
    title_template: "Does disabled TLS verification allow MITM against sandbox test server?"
    validation_method: network_probe
    prerequisites:
      - Sandbox MITM proxy and test HTTPS endpoint
    safe_scope:
      max_requests: 5
      rate_limit_rps: 1
      allowed_targets: ["sandbox-mitm-lab"]
      forbidden_actions: ["modify_production_data"]
    success_criteria: "Client accepts intercepted certificate when verify=False"
    example_poc: "curl --insecure via sandbox mitmproxy to test host"

  - id: cicd-secret-env
    category: ci-cd
    trigger_control_ids:
      - cicd-secret-in-env
      - cicd-pull-request-target
    type: credential_forgery
    title_template: "Does the exposed workflow secret pattern work against sandbox metadata test endpoint?"
    validation_method: token_forgery
    prerequisites:
      - Redacted secret pattern from finding
      - Sandbox metadata mock
    safe_scope:
      max_requests: 3
      rate_limit_rps: 1
      allowed_targets: ["sandbox-metadata-endpoint"]
      forbidden_actions: ["bruteforce", "modify_production_data"]
    success_criteria: "Test token accepted by sandbox mock auth"
    example_poc: "POST sandbox /validate with synthetic token shape from finding"

  - id: container-privileged
    category: infra
    trigger_control_ids:
      - container-privileged
      - container-host-namespace
    type: privilege_escalation
    title_template: "Can a privileged sandbox container escape to host namespaces?"
    validation_method: sandbox_execution
    prerequisites:
      - Disposable privileged container in isolated bridge
    safe_scope:
      max_requests: 3
      rate_limit_rps: 1
      allowed_targets: ["sandbox-container"]
      forbidden_actions: ["modify_production_data", "delete"]
    success_criteria: "Marker file visible on host mount from container proof script"
    example_poc: "docker run --privileged sandbox escape probe"

  - id: container-no-limits
    category: infra
    trigger_control_ids:
      - container-no-limits
    type: injection
    title_template: "Can memory pressure in an unbounded sandbox container cause OOM in cgroup?"
    validation_method: sandbox_execution
    prerequisites:
      - Sandbox container without memory limits
    safe_scope:
      max_requests: 2
      rate_limit_rps: 1
      allowed_targets: ["sandbox-container"]
      forbidden_actions: ["modify_production_data"]
    success_criteria: "OOMKilled event recorded in cgroup metrics for sandbox only"
    example_poc: "stress-ng --vm 1 in sandbox container"

  - id: network-egress-open
    category: infra
    trigger_control_ids:
      - network-egress-world-open
    type: network_exposure
    title_template: "Can sandbox workload reach a controlled egress hop when egress is 0.0.0.0/0?"
    validation_method: network_probe
    prerequisites:
      - Controlled egress listener in test net
    safe_scope:
      max_requests: 5
      rate_limit_rps: 1
      allowed_targets: ["controlled-egress-hop"]
      forbidden_actions: ["modify", "delete"]
    success_criteria: "TCP connect from sandbox to controlled hop succeeds"
    example_poc: "curl http://egress-test.local from sandbox pod"

  - id: iam-wildcard-action
    category: infra
    trigger_control_ids:
      - iam-wildcard-action
      - iam-passrole-wildcard
    type: privilege_escalation
    title_template: "Can sandbox principal with wildcard policy perform disallowed admin action?"
    validation_method: config_exploit
    prerequisites:
      - IAM policy replayed in sandbox LocalStack or mock
    safe_scope:
      max_requests: 5
      rate_limit_rps: 1
      allowed_targets: ["sandbox-iam-mock"]
      forbidden_actions: ["modify_production_data"]
    success_criteria: "Mock IAM simulator allows privileged action with wildcard policy"
    example_poc: "Simulate policy against sandbox IAM mock"

  - id: crypto-self-signed-prod
    category: crypto
    trigger_control_ids:
      - crypto-cert-self-signed-prod
    type: network_exposure
    title_template: "Does production code accept self-signed cert without pinning in sandbox TLS test?"
    validation_method: network_probe
    prerequisites:
      - Sandbox HTTPS server with self-signed cert
    safe_scope:
      max_requests: 3
      rate_limit_rps: 1
      allowed_targets: ["sandbox-tls-server"]
      forbidden_actions: ["modify_production_data"]
    success_criteria: "Client completes handshake without custom CA"
    example_poc: "requests.get(sandbox_url, verify=False) succeeds"

  - id: authz-mass-assignment
    category: authz
    trigger_control_ids:
      - authz-mass-assignment
    type: privilege_escalation
    title_template: "Can setting role=admin in request body elevate privileges on sandbox API?"
    validation_method: parameter_tampering
    prerequisites:
      - Sandbox API with mass-assignment vulnerable handler
    safe_scope:
      max_requests: 10
      rate_limit_rps: 2
      allowed_targets: ["self-hosted-test-api"]
      forbidden_actions: ["modify_production_data", "delete"]
    success_criteria: "PATCH with role=admin returns elevated session or admin flag"
    example_poc: "PATCH /api/profile {\"role\":\"admin\"} with user token"

  - id: supply-untrusted-module
    category: supply-chain
    trigger_control_ids:
      - supply-image-untrusted
      - container-docker-socket-mount
    type: config_exploit
    title_template: "Does untrusted Terraform/Docker module source allow supply-chain compromise in sandbox?"
    validation_method: config_exploit
    prerequisites:
      - Module URL from finding cloned in isolated git mirror
    safe_scope:
      max_requests: 3
      rate_limit_rps: 1
      allowed_targets: ["sandbox-git-mirror"]
      forbidden_actions: ["modify_production_data"]
    success_criteria: "Suspicious commit or unsigned tag detected in mirrored module history"
    example_poc: "git log --oneline sandbox mirror of module source"
